name: Periodic Model Calibration - Github Lab 2

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_run:            # also right after a retrain succeeds
    workflows: ["Model Retraining on Push to Main - Github Lab 2"]
    types: [completed]
  workflow_dispatch:
    inputs:
      method:
        description: "isotonic or sigmoid"
        default: "isotonic"

permissions:
  contents: write

env:
  LAB: Labs/Github_Labs/Lab2

jobs:
  calibrate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main   

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: pip install -r $LAB/requirements.txt

    - name: Calibrate Latest Model
      run: python $LAB/src/calibrate_model.py --method "${{ github.event.inputs.method || 'isotonic' }}"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "rexremigius"
        git config --global user.email "60751701+rexremigius@users.noreply.github.com"
        git add -f $LAB/models/*_calibrated.joblib $LAB/metrics/*_calibration.json
        if ! git diff --cached --quiet; then
          git commit -m "Lab2: calibrated model [skip ci]"
          git pull --rebase
          git push
        else
          echo "No changes to commit."
        fi
