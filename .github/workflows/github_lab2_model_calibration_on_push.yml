name: Model Retraining on Push to Main - Github Lab 2

on:
  push:
    branches:
      - main
    paths:
      - "Labs/Github_Labs/Lab2/**"   # only run when this lab changes
  workflow_dispatch:

permissions:
  contents: write

env:
  LAB: Labs/Github_Labs/Lab2

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: pip install -r $LAB/requirements.txt

    - name: Generate and Store Timestamp
      run: echo "timestamp=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Retrain Model
      run: python $LAB/src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model (fails if test F1 < 0.90)
      run: python $LAB/src/evaluate_model.py --timestamp "$timestamp"

    - name: Upload MLflow runs
      uses: actions/upload-artifact@v4
      with:
        name: mlruns-${{ env.timestamp }}
        path: ${{ env.LAB }}/mlruns/

    - name: Commit and Push Changes
      run: |
        git config --global user.name "rexremigius"
        git config --global user.email "60751701+rexremigius@users.noreply.github.com"
        git add -f "$LAB/metrics/${timestamp}_metrics.json" "$LAB/models/model_${timestamp}_gb.joblib"
        if ! git diff --cached --quiet; then
          git commit -m "Lab2: model + metrics for $timestamp [skip ci]"
          git pull --rebase
          git push
        else
          echo "No changes to commit."
        fi
